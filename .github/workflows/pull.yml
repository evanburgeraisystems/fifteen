name: Daily listings pull

# Pulls every company on data/seed/companies.json from its public job-board API (Greenhouse, Lever, Ashby),
# verifies each apply link, and commits the dated snapshot + history back to the repo. The committed
# snapshot history is the "Last Intern Cycle" dataset. See docs/DATA_PIPELINE.md.

on:
  schedule:
    - cron: '0 11 * * *' # 11:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pull-listings
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Pull, verify links, write snapshot
        run: npm run pull

      - name: Commit data changes
        run: |
          git config user.name "fifteen-bot"
          git config user.email "fifteen-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: listings snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
