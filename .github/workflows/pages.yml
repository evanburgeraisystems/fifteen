name: Deploy demo to GitHub Pages

# Builds the app under /fifteen/ and publishes it to https://evanburgeraisystems.github.io/fifteen/.
# Runs on every push to master and after the daily pull (its bot commit can't trigger a push run).

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ['Daily listings pull']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npx vite build
        env:
          PAGES_BASE: /fifteen/

      # Pages has no SPA fallback: serve the app for deep links (e.g. demo posting tabs).
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
